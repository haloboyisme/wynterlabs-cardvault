[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wynterlabs-cards-api"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<1.17",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50.0.1,<51",
  "asyncpg>=0.30,<0.31",
  "email-validator>=2.2,<3",
  "fastapi>=0.133.1,<0.134",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic-settings>=2.10,<3",
  "rapidocr>=3.4,<4",
  "onnxruntime>=1.22,<2",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "starlette>=1.3.1,<1.4",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<0.22",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
