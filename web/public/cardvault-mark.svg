<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">WynterLabs CardVault</title>
  <desc id="description">A glowing card and ampersand mark.</desc>
  <defs>
    <linearGradient id="panel" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#18263b"/><stop offset="1" stop-color="#0b101b"/></linearGradient>
    <linearGradient id="edge" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#7ce8e2"/><stop offset=".52" stop-color="#78b7ff"/><stop offset="1" stop-color="#cf67df"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="15" fill="url(#panel)" stroke="#273957" stroke-width="2"/>
  <g transform="rotate(-7 32 32)">
    <rect x="18" y="10" width="30" height="43" rx="7" fill="#0d1726" stroke="url(#edge)" stroke-width="2.4"/>
    <path d="M23 18h20M23 45h20" stroke="#78b7ff" stroke-opacity=".38" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M23 17v7M23 17h7M43 46v-7M43 46h-7" fill="none" stroke="#7ce8e2" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="32" y="40" text-anchor="middle" fill="#e9fffd" font-family="ui-rounded, system-ui, sans-serif" font-size="25" font-weight="700" filter="url(#glow)">&amp;</text>
</svg>
